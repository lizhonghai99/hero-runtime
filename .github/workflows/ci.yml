name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Hero.slnx

      - name: Build
        run: dotnet build Hero.slnx -c Release --no-restore

      # Full `dotnet format --verify-no-changes` needs a one-time EOL normalize on this repo.
      # Keep .editorconfig as the style source of truth until then.
      - name: Test
        run: dotnet test tests/Hero.Core.Tests/Hero.Core.Tests.csproj -c Release --no-build --verbosity normal
